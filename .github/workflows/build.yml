name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-${{ runner.os }}-

    - name: Install Buildozer & Cython
      run: |
        python -m pip install --upgrade pip
        python -m pip install "cython<3.0.0"
        python -m pip install buildozer

    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = My Test App
        package.name = mytestapp
        package.domain = org.test
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas
        version = 0.1
        requirements = python3,kivy
        orientation = portrait
        fullscreen = 0

        android.api = 33
        android.minapi = 21
        android.ndk = 25b
        android.ndk_api = 21
        android.accept_sdk_license = True
        android.archs = arm64-v8a

        [buildozer]
        log_level = 2
        warn_on_root = 0
        EOF

    - name: Clean old build
      run: |
        rm -rf .buildozer bin/

    - name: Build APK
      env:
        JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
      run: |
        export BUILDOZER_WARN_ON_ROOT=0
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: My-Android-App
        path: bin/*.apk
        
